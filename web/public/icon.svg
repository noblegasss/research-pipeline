<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f1f3d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Magnifying glass body -->
  <circle cx="220" cy="210" r="90" fill="none" stroke="#60a5fa" stroke-width="20"/>
  <line x1="284" y1="274" x2="370" y2="360" stroke="#60a5fa" stroke-width="22" stroke-linecap="round"/>
  <!-- Document lines inside glass -->
  <line x1="175" y1="185" x2="265" y2="185" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <line x1="175" y1="215" x2="250" y2="215" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <line x1="175" y1="245" x2="235" y2="245" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <!-- Sparkle / AI indicator -->
  <circle cx="390" cy="130" r="8" fill="#fbbf24"/>
  <circle cx="420" cy="160" r="5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="360" cy="155" r="6" fill="#fbbf24" opacity="0.5"/>
  <!-- Bottom text area hint -->
  <rect x="120" y="390" width="272" height="8" rx="4" fill="#334155"/>
  <rect x="120" y="410" width="200" height="8" rx="4" fill="#334155"/>
  <rect x="120" y="430" width="240" height="8" rx="4" fill="#334155"/>
</svg>
